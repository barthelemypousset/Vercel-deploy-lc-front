<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year !</title>
</head>
<body>
    <div id="year"></div>
</body>
<script>
    yearDiv = document.querySelector("#year")
    fetch('https://vercel-deploy-lc.vercel.app/year')
        .then(response => response.json())
        .then(data => {
            yearDiv.textContent += data.year;
        });
</script>
</html>
